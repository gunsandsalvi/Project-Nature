  { path = "std::sync::atomic::AtomicI8", reason = "A2.3 rule 3: no interior mutability in world state" },
  { path = "std::sync::atomic::AtomicI16", reason = "A2.3 rule 3: no interior mutability in world state" },
  { path = "std::sync::atomic::AtomicIsize", reason = "A2.3 rule 3: no interior mutability in world state" },
