# B09 pre-test entry (throwaway). MAT-05, MAT-13, MAT-16 layer 1.
id = "cortical-bone"
name = "Cortical bone"
catalogue = "ingredients"
layer = 1
summary = """
The dense outer layer of bones: collagen fibres stiffened with bone \
mineral. Hard and tough, and the raw material for awls, points, needles \
and flutes."""

[[properties]]
property = "density"
value = 1.85
low = 1.7
high = 2.0
basis = "midpoint"
unit = "g/cm3"
condition = "human cortical bone; summary table in a scaffold paper"
source = "feng-2014"
quote = "Density Compressive strength Stiffness Fracture toughness Microhardness (g/cm3) (MPa) (GPa) (MPam1/2) (GPa) Cortical bone 1.7-2.0 130-180 7-30 2-12 0.62-0.74"

[[properties]]
property = "hardness"
value = 0.68
low = 0.62
high = 0.74
basis = "midpoint"
unit = "GPa"
condition = "microhardness (Vickers), human cortical bone"
source = "feng-2014"
quote = "Density Compressive strength Stiffness Fracture toughness Microhardness (g/cm3) (MPa) (GPa) (MPam1/2) (GPa) Cortical bone 1.7-2.0 130-180 7-30 2-12 0.62-0.74"

[[properties]]
property = "fracture_toughness"
value = 7
low = 2
high = 12
basis = "midpoint"
unit = "MPa*m^0.5"
condition = "human cortical bone; depends strongly on crack direction"
source = "feng-2014"
quote = "Density Compressive strength Stiffness Fracture toughness Microhardness (g/cm3) (MPa) (GPa) (MPam1/2) (GPa) Cortical bone 1.7-2.0 130-180 7-30 2-12 0.62-0.74"

[[properties]]
