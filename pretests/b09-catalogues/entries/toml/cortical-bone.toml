unit = "GPa"
condition = "human cortical bone (the table cites its ref. 36)"
source = "sellani-2016"
quote = "Physical property Sawbones® Cortical bone Density (kg/m3) 1700a 1810b Tensile strength (ultimate) (MPa) 90a 124b Modulus of elasticity (GPa) 12.4a 17.6b"

[[properties]]
property = "tensile_strength"
value = 124
unit = "MPa"
condition = "human cortical bone, ultimate tensile strength"
source = "sellani-2016"
quote = "Physical property Sawbones® Cortical bone Density (kg/m3) 1700a 1810b Tensile strength (ultimate) (MPa) 90a 124b Modulus of elasticity (GPa) 12.4a 17.6b"

[[properties]]
property = "compressive_strength"
value = 155
low = 130
high = 180
basis = "midpoint"
unit = "MPa"
condition = "human cortical bone"
source = "feng-2014"
quote = "Density Compressive strength Stiffness Fracture toughness Microhardness (g/cm3) (MPa) (GPa) (MPam1/2) (GPa) Cortical bone 1.7-2.0 130-180 7-30 2-12 0.62-0.74"

[[properties]]
property = "thermal_conductivity"
value = 0.68
plusminus = 0.01
unit = "W/(m*K)"
condition = "human cortical bone, measured"
source = "feldmann-2018"
quote = "0.68 ± 0.01 W/mK for human cortical bone"

[[gaps]]
property = "specific_heat"
note = """
The checkable source (Sellani 2016, Table 1) prints "Specific heat \
(J/kg °C) ... 1.25", a unit error: 1.25 J/kg would be a thousand times \
too small. The likely right value (1313 J/kg/K, IT'IS database) sits on \
a page filled in by JavaScript, which the checker can't read."""

