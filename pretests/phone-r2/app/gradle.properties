org.gradle.jvmargs=-Xmx3g
# Required by ML Kit (B73), which brings in AndroidX; the build stops at checkDebugAarMetadata without it.
android.useAndroidX=true
kotlin.code.style=official
# Ride out rate limits on shared cloud egress.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
