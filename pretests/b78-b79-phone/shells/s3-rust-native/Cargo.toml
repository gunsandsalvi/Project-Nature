[package]
name = "shell3"
version = "0.1.0"
edition = "2021"
# B78 shell 3: pure native Rust app (NativeActivity via android-activity), no Kotlin, no Gradle.

[lib]
name = "main"
crate-type = ["cdylib"]

[dependencies]
kcore = { path = "../core" }
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = "0.9"

[profile.release]
strip = true
