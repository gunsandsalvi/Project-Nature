[package]
name = "kphone"
version = "0.1.0"
edition = "2021"
publish = false
# B79: phone helpers for the round-1 app: native memory steps (PLT-01 budget) and CPU checks.

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
android = ["dep:jni"]

[dependencies]
libc = "0.2"
jni = { version = "0.21", optional = true, default-features = false }
