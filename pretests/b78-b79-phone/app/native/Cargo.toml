# B78/B79 round-1 app: native crates built in this folder. The real kbench (B01/B02)
# lives in pretests/b01-b02-numbers-random/kbench and is built from there when it compiles.
[workspace]
members = ["stub-kbench", "kphone"]
resolver = "2"

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
