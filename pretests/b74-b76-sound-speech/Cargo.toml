[package]
name = "ksound"
version = "0.1.0"
edition = "2021"
publish = false
# B74 pre-test (SND-01, SND-06, SND-08, CUL-10): impact and instrument sounds made from
# material properties and shapes, a small mixer, and the phone audio test (AAudio, feature "android").

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
android = ["dep:jni"]

[dependencies]
serde_json = "1"
libc = "0.2"
jni = { version = "0.21", optional = true, default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
strip = true
