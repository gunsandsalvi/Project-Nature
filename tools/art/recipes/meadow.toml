# The meadow's textures (catalogue 1.1): what tools/art/make_tiles.py reads to make art/textures/meadow/ from the
# pictures kept in art/sources/meadow/. Nothing here is random: the same recipe gives the same bytes.
name = "meadow"
about = "meadow grass and earth: short grass blades with earth showing between them (tufts, flowers and stones are pieces of their own)"
seed = 1101
reference = "near"
how = "drawn by the artist in conversation with the art lane, each tile judged in the game's view against sheet 1.1's camera views, and put on the texture-pixel grid by code"
truth = "art lane, 7 October 2026: looked at every level at twice size against A5.6's list; grass and earth only, nothing countable, no tufts, flowers or stones"
approved = "not offered yet: the pilot's first piece, waiting for the builder's check and your look at the previews"

[[tile]]
tile = "near"
versions = 4
ring = 4
overlap = 8
patch = 48
serves = 2
sheet = "art/sources/meadow/near-A.webp"
extra = ["art/sources/meadow/near-C.webp"]
originals = ["art/sources/meadow/near-A-original.webp", "art/sources/meadow/near-C-original.webp"]
requests = ["art/requests/meadow/turn-02.txt", "art/requests/meadow/turn-04.txt", "art/requests/meadow/turn-06.txt"]

[[tile.level]]
level = 1
overlap = 8
patch = 32
pictures = ["art/sources/meadow/near-A-b1.webp", "art/sources/meadow/near-C-b1.webp"]
originals = ["art/sources/meadow/near-A-b1-original.webp", "art/sources/meadow/near-C-b1-original.webp"]

[[tile]]
tile = "middle"
versions = 4
ring = 4
overlap = 8
patch = 48
serves = 2
# A4.8 asks for accents of about 20 on the screen at every band: on the finished frame the middle tile's bands scored
# 16 against the near tile's 23 to 26, so each of its levels is made bolder after it is made (a boost, the same for all
# four versions, so it makes no seam)
boost = 120
sheet = "art/sources/meadow/middle-A.webp"
extra = ["art/sources/meadow/middle-B.webp", "art/sources/meadow/middle-C.webp"]
originals = [
  "art/sources/meadow/middle-A-original.webp",
  "art/sources/meadow/middle-B-original.webp",
  "art/sources/meadow/middle-C-original.webp",
]
requests = ["art/requests/meadow/turn-03.txt", "art/requests/meadow/turn-04.txt", "art/requests/meadow/turn-06.txt"]

[[tile.level]]
level = 1
overlap = 8
patch = 32
boost = 140
pictures = ["art/sources/meadow/middle-A-b3.webp", "art/sources/meadow/middle-B-b3.webp", "art/sources/meadow/middle-C-b3.webp"]
originals = [
  "art/sources/meadow/middle-A-b3-original.webp",
  "art/sources/meadow/middle-B-b3-original.webp",
  "art/sources/meadow/middle-C-b3-original.webp",
]

[[tile]]
tile = "far"
versions = 4
ring = 4
overlap = 24
flatten = 32
patch = 64
serves = 3
# The far tile goes on from the middle tile's ladder, not from the sheet's far tile (kept in art/sources/meadow, far-sheet
# and its original: its swathes dropped band 4 from bright grass to a cloud and showed as a lattice at bands 5 and 6,
# where eight of its tiles lie across the screen). It is a 4 x 4 mosaic of the middle tile's versions at their level 2,
# whose pixels are as wide as its own, so band 4 is the next step down from band 3 with no jump, and nothing in it is
# bigger than the middle tile's own clumps, so no swathe repeats.
coarse_of = "middle"
coarse_level = 2
# the boosted middle ladder runs a little bolder than the near tile at these bands, so each level is brought back
boost = 100
# and the grain, which at bands 5 and 6 covered everything evenly and competed with the growth masses of the patch, is
# grouped: each version's contrast is multiplied by blotches of its own, of many sizes and gently changing, from 12% in
# the calm places to 135% in the busy ones, so the accents are about as many but quiet ground lies between their groups
calm = 12
busy = 135

# the coarser levels keep the accents of the level above (100 percent of what does)
[[tile.level]]
level = 1
contrast = 100
boost = 100

[[tile.level]]
level = 2
contrast = 100
boost = 100
