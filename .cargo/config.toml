# Per-target settings (A2.8). No target-cpu and no fast-math flag anywhere (A3.2).

# The phone: 16 KB pages for Android 15 and later.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# arm64 Linux, to run tests under qemu on the cloud machine (the cross-target check, A15.9).
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = "qemu-aarch64-static -L /usr/aarch64-linux-gnu"

# The web: WebAssembly SIMD, which every browser that runs WebGL2 has.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128"]
