# A recipe (A6.1, PRE-46): the hearth ring of sheet 16.13 put together from the kit's parts, the art lane's own parts
# of the camp family (art/models/camp.blend, made by tools/art/parts_things.py): twelve stones, each its own part
# (long flattened ovals, small cobbles, angular lumps, a kidney, a wedge) laid on a ring of 0.5 m radius clockwise
# from north in the order of the design, a few centimetres apart, each a little off its place and turned a little off
# the tangent; the outside 1.2 m across, the opening 0.8 m. The fire, the ash and the soot are pieces of their own.
# The small form (A6.3) is the same thing in the smallest parts, for the close camp and the camp (bands 3 and 4).
about = "a ring of twelve stones round a fire, 1.2 m across and 0.2 m high at most (small form)"
family = "camp"
truth = "art lane, 8 October 2026: looked at the parts and the thing from every side at twice size against A5.6's list; river cobbles and a few angular lumps, grey, buff and slate, in a ring, nothing sawn, split, painted or made of metal"
approved = "not offered yet: a piece of T2.3c.2, waiting for the builder's check and your look at the previews"

