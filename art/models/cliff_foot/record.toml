# A recipe (A6.1, PRE-46): what lies at the foot of the camp's cliff, scattered by the seed: four boulders of the
# rocks family (the large granite and the limestone block close under the lip, two small domes between, each half sunk
# and turned its own way), and the stones that came down with them, each at a place of its own, none on a ring:
# gathered in four clusters along the cliff, which runs east and west through the recipe's origin, thickest right
# under the lip and thinning out to about 7 m (broken limestone, small, medium and large, and the thin dark flakes of
# the shale weathering out beneath). The fine scree between is the ground's texture (art:scree).
about = "the foot of the cliff: four boulders, scree stones and shale flakes strewn over about 14 m of ground (full form)"
family = "rocks"
truth = "art lane, 8 October 2026: looked at the parts and the thing from every side at twice size against A5.6's list; boulders and broken limestone and a few dark shale flakes lying loose on the ground, no vegetation, no soil, no painted marks, no tool marks"
approved = "not offered yet: a piece of the cliff's foot, waiting for the builder's check and your look at the previews"

