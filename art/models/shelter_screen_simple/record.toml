# A recipe (A6.1, PRE-46): the hide screen of sheet 16.12 put together from the kit's parts of the camp family
# (art/models/camp.blend, made by tools/art/parts_screen.py): a curtain of six unequal sewn hides hung from a ridge
# pole between two forked posts, 5 m wide and 2.3 m high, its foot weighed with eleven stones, with a door flap over a
# slit in the lower right hide. Every part is modelled where it belongs in the screen's own metres (x along it with
# its middle on the origin, z up, the outside toward -y, the south), so each is laid at the origin (a root); the scene
# turns the whole thing to close the mouth of the rock shelter, laid against the cliff's bay with its outside toward
# the open ground. The simple form (A6.3) is the same thing in parts of fewer triangles, for the zoom where the screen
# is 80 to 160 pixels across: the hides meshed coarsely, without the sewn seams' strips and the ties.
about = "a curtain of six sewn hides on a ridge pole between two forked posts, closing a rock shelter, 5 m wide (simple form)"
family = "camp"
truth = "art lane, 8 October 2026: looked at the parts and the screen from every side at twice size against A5.6's list; hides sewn with small close running stitches, rawhide ties, posts and pole of plain bark, no painted designs, no metal, no sawn wood, no rock shelter or ground in it"
approved = "not offered yet: a piece of T2.3c.2, waiting for the builder's check and your look at the previews"

