# A recipe (A6.1, PRE-46): one thing put together from the kit's parts. This one is the pilot's small round hide tent
# (sheet 16.4), made of the stand-in family's parts until the art lane's own parts arrive: a cover of hides on a cone of
# ten poles tied where they cross, a low door and its flap, ringed by 24 stones; 4.2 m across, the cover 2.6 m high, the
# poles crossing at 2.7 m.
about = "a small round tent of hides on a cone of ten poles, its hem held down by a ring of 24 stones"
family = "standin_camp"
truth = "builder, 2026-10-07: a stand-in for the pilot, after sheet 16.4; no smoke flaps, no painted designs, no sawn wood"
approved = "not offered yet: a stand-in, below the artwork's level"

[[material]]
role = "wood"
textures = ["art:standin_wood"]

[[material]]
role = "hide"
textures = ["art:standin_hide"]

[[material]]
role = "stone"
textures = ["art:standin_stone"]

# the cover, at the origin, its door to the south
[[place]]
name = "cover"
parts = ["cover"]
rule = "root"

# ten poles from a ring of 1.75 m, inside the cover's hem, to the point 2.7 m up where they cross, each a little
# thicker or thinner
[[place]]
name = "poles"
parts = ["pole"]
rule = "span"
count = 10
joint = "foot"
to_joint = "bind"
radius = "1.75 m"
height = "2.7 m"
turn = 18
face = 0
jitter_radius = "2%"
jitter_turn = 3
jitter_size = "12%"

# the lashing where they cross, plugged into the cover's apex
[[place]]
name = "lashing"
parts = ["binding"]
rule = "plug"
joint = "centre"
onto = "cover.apex"

# the door flap, hung from the top of the door along the cover's slope
[[place]]
name = "flap"
parts = ["door_flap"]
rule = "plug"
joint = "hinge"
onto = "cover.door_top"

# 24 stones round a ring of 2.1 m, in three shapes by the seed, each a little off its place
[[place]]
name = "stones"
parts = ["stone_a", "stone_b", "stone_c"]
rule = "ring"
count = 24
radius = "2.1 m"
jitter_radius = "5%"
jitter_turn = 3
face = 0
