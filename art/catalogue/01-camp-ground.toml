# The catalogue (IMPLEMENTATION.md, The catalogue): group 1, The camp's ground.
# Each piece gets its sheet, as the catalogue sets out; you sign each one off, and it is kept in sheets/.
group = "The camp's ground"
about = "The ground the first camp stands on, by the river under the cliff: the first textures the engine needs."
items = ["PRE-20", "PRE-22", "WLD-31", "MAT-08"]

[[piece]]
id = "meadow"
name = "Meadow grass and earth"
what = "the grassland's own surface: short grass blades, earth showing between them; the tufts, flowers and stones on it are pieces of their own"
art_book = ["textures-a", "meadow-band2", "d2-pixel-paint", "delight-liked"]

[[piece]]
id = "wear"
name = "Trodden ground: paths and camp floors"
what = "the wear layer the world lays over any ground where people walk, from flattened grass to bare packed earth, as a path or a camp floor; it appears, grows and fades with use"
art_book = ["d2-pixel-paint", "close-camp", "camp-thirty"]
sheet = "sheets/1.2-wear.webp"
signed_off = "7 October 2026"

[[piece]]
id = "bare_earth"
