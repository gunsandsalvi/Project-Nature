# The catalogue (IMPLEMENTATION.md, The catalogue): group 16, Shelters and camp structures.
# Each piece gets its sheet, as the catalogue sets out; you sign each one off, and it is kept in sheets/.
group = "Shelters and camp structures"
about = "Every kind of shelter and structure people build, each true to what excavations show, and what a camp holds."
items = ["MAT-23", "PRE-24", "PRE-42", "CUL-28", "CUL-26"]

[[piece]]
id = "windbreak"
name = "Windbreak"
what = "a screen against the wind beside a hearth: a bar on two forked posts, with cut leafy brush leaned against it any old way, 3 m wide and 1.5 m high, drying brown in weeks"
art_book = ["made-things-sheet"]
sheet = "sheets/16.1-windbreak.webp"
signed_off = "7 October 2026"

[[piece]]
id = "lean_to"
name = "Lean-to"
what = "a sloping roof on a ridge bar laid in two forked posts, open at the front, 3 m wide and 1.7 m high: eight rafters to the ground, staggered courses of birch-bark sheets held by three poles, or reed bundles instead"
art_book = ["lake-mist-close"]
sheet = "sheets/16.2-lean_to.webp"
signed_off = "7 October 2026"

