# The catalogue (IMPLEMENTATION.md, The catalogue): group 3, The rest of the ground.
# Each piece gets its sheet, as the catalogue sets out; you sign each one off, and it is kept in sheets/.
group = "The rest of the ground"
about = "Every other ground the world has, from tundra to tropical forest, and the ground after fire, flood and lava."
items = ["WLD-31", "WLD-17", "WLD-26", "WLD-28", "WLD-15", "PRE-25"]

[[piece]]
id = "broadleaf_floor"
name = "Broadleaf forest floor"
what = "fallen leaves over dark humus, with moss, through the seasons; twigs, nuts, mushrooms and plants are pieces of their own"
art_book = ["textures-a", "read-aids"]
sheet = "sheets/3.1-broadleaf_floor.webp"
signed_off = "7 October 2026"

