# The catalogue (IMPLEMENTATION.md, The catalogue): group 2, Rock and stone.
# Each piece gets its sheet, as the catalogue sets out; you sign each one off, and it is kept in sheets/.
group = "Rock and stone"
about = "The world's twelve kinds of rock as cliff and stone, the shapes rock takes, and the deposits people find in it."
items = ["WLD-09", "WLD-14", "PRE-23", "PRE-24"]

[[piece]]
id = "granite"
name = "Granite"
what = "pale grey speckled rock: massive, few long joints, rounded swells and curved sheets; lichen, moss and loose boulders are pieces of their own"
art_book = ["textures-a", "delight-liked", "first-cave"]
sheet = "sheets/2.1-granite.webp"
signed_off = "7 October 2026"

[[piece]]
id = "basalt"
name = "Basalt"
what = "dark volcanic rock in tall five- and six-sided columns with flat faces, cross-cracked, with rare small gas holes"
sheet = "sheets/2.2-basalt.webp"
signed_off = "7 October 2026"

[[piece]]
id = "tuff"
name = "Lava and ash rock"
what = "rough, matt volcanic rock of welded ash, grainy buff-grey, full of pale pumice and dark lava fragments and small pits, in thick rough beds that weather into rounded masses"
sheet = "sheets/2.3-tuff.webp"
signed_off = "7 October 2026"

[[piece]]
