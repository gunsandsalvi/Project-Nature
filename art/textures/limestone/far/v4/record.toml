about = "the pale layered limestone of the camp's cliff, its face seen straight on: beds that thicken and pinch out, joints, ledges and pits (caves, stains, soot and scree are pieces of their own); far tile, 64.0 m across, version 4"
route = "picture"
tile_texels = 256
texels_a_metre = 4
first_band = 4
