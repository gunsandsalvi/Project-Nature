# P4's tuning (IMPLEMENTATION α0.3a, RES-16): every value that sets the pace of discovery, the same in every run,
# each with what it was tuned against. The scene's own values, which are the world's and never tuned for pace, are
# under [scene]. Pre-production data (research 00).

# MND-11's factors for how a try was made: by accident, by experimenting, with a hunch.
[routes]
accident = 0.05     # 1 in 20 (MND-11's starting value)
experiment = 0.2    # 1 in 5
hunch = 0.5         # 1 in 2

# Each blueprint's difficulty (MAT-04) and discovery factor (MND-11), 1 unless tuned.
[blueprints.flake]
action = "strike"
sector = "stone"
difficulty = 2
factor = 0.292
hint = 0.1   # MAT-04's failures: a strike of flaking stone that gives no flake throws a sharp chip, its hint

[blueprints.drill]
action = "drill"
sector = "fire"
difficulty = 4
factor = 0.0733
hint = 0.2   # a failed try with dry wood smokes

[blueprints.plough]
action = "grind"
sector = "fire"
difficulty = 5
factor = 0.0733
hint = 0.2

[minds]
notice_least = 0.25         # MND-10: a surprise noticed 1 time in 4 by the least curious
notice_most = 0.75          # 3 in 4 by the most curious; half as often when busy
experiment_curious = 1.0    # MND-11: experiments a day for the most curious adult in good times
experiment_average = 0.143  # about once a week for an average one
dream_hint = 0.0167         # MND-12: about 1 dream in 60 joins memories into a hunch
dream_hint_need = 0.05      # 1 in 20 while a need is below 20
dream_real = 0.333          # 1 time in 3 the hunch points to a real blueprint
hunch_tries = 10            # MND-11: a hunch is dropped after about 10 failed tries
hunch_days = 60             # or a year unused
hunches_held = 5            # MND-14: a person holds at most 5
watch_uses = 5.0            # MND-13: about five watched uses teach a blueprint at skill 1
taught = 4.0                # a taught try adds about four times a lone try's skill

[scene]
flint = 0.2           # the share of the stones in reach that flake (flint among granite and sandstone)
carcass = 0.15        # the chance a day brings a carcass to butcher and its bones to crack
lightning = 0.03      # the chance a dry-season day brings a wildfire near enough to take fire from (WLD-28)
fire_lost = 0.01      # the chance a day the band's fire goes out for good, to rain or neglect
dry = [0.6, 0.85, 0.7, 0.35]   # the share of wood in reach dry enough to burn (RCK-02), by season
