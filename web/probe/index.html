<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kindling phone check</title>
<style>
:root { --bg: #0d0b14; --fg: #f2dcaa; --dim: #8f8790; --ok: #a29441; --bad: #de621c; color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d0b14; --fg: #f2dcaa; --dim: #8f8790; } }
:root[data-theme="dark"] { --bg: #0d0b14; --fg: #f2dcaa; --dim: #8f8790; }
html, body { margin: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
body { padding: 24px 16px; font: 16px/1.5 system-ui, sans-serif; max-width: 640px; margin: 0 auto; box-sizing: border-box; }
h1 { font-size: 28px; line-height: 1.2; margin: 0 0 20px; overflow-wrap: anywhere; }
ul { list-style: none; padding: 0; margin: 0 0 20px; }
li { padding: 6px 0; border-bottom: 1px solid #28232f; overflow-wrap: anywhere; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
#code { font: 13px/1.4 ui-monospace, monospace; color: var(--dim); overflow-wrap: anywhere; }
button { font: inherit; color: var(--fg); background: none; border: 1px solid var(--dim); border-radius: 4px; padding: 4px 10px; }
canvas { display: none; }
</style></head>
<body>
<h1 id="top">Checking…</h1>
<ul id="list"></ul>
<p id="code"></p>
<p><button id="copy">Copy</button></p>
<canvas id="gl" width="64" height="64"></canvas>
<script>
// Kindling's phone check (A15.4, A17.3): does WebAssembly, with SIMD, run in this page? Every result is shown, never a blank page.
const B64 = 'AGFzbQEAAAABCwJgAn9/AX9gAAF/AwMCAAEHDgIDYWRkAAAEc2ltZAABChMCBwAgACABagsJAEED/RH9GwAL';
const results = [];
function show(name, err) {
  results.push([name, err]);
  const li = document.createElement('li');
  li.innerHTML = `<b>${name}</b>: <span class="${err ? 'bad' : 'ok'}"></span>`;
  li.querySelector('span').textContent = err ? 'blocked: ' + err : 'ok';
  document.getElementById('list').append(li);
}
async function run(name, f) {
  try { await f(); show(name, null); } catch (e) { show(name, String(e && e.message || e)); }
}
function testModule(m) {
  const e = m.instance.exports;
  if (e.add(2, 3) !== 5) throw new Error('add(2, 3) gave ' + e.add(2, 3));
  if (e.simd() !== 3) throw new Error('simd() gave ' + e.simd());
}
(async () => {
  await run('wasm', async () => {
    const bytes = Uint8Array.from(atob(B64), (c) => c.charCodeAt(0));
    testModule(await WebAssembly.instantiate(bytes));
  });
  await run('fetch', async () => {
    const r = await fetch('probe.wasm');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    testModule(await WebAssembly.instantiate(await r.arrayBuffer()));
  });
  await run('module', async () => {
    const m = await import('./probe-mod.js');
    if (m.ok() !== 'module ok') throw new Error('unexpected answer');
  });
  await run('webgl2', async () => {
    const gl = document.getElementById('gl').getContext('webgl2');
    if (!gl) throw new Error('no WebGL2 context');
    const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
      if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }'));
    gl.attachShader(p, sh(gl.FRAGMENT_SHADER, '#version 300 es\nprecision mediump float; out vec4 c; void main() { c = vec4(1.0, 0.0, 0.0, 1.0); }'));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    gl.useProgram(p);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, 0, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const px = new Uint8Array(4);
    gl.readPixels(32, 32, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    if (!(px[0] > 200 && px[1] < 50 && px[2] < 50)) throw new Error('middle pixel is ' + Array.from(px).join(','));
  });
  await run('idb', () => new Promise((ok, fail) => {
    // Reported, never blocking: without IndexedDB the game runs in memory (A14.11).
    const r = indexedDB.open('kindling-probe');
    r.onsuccess = () => { r.result.close(); ok(); };
    r.onerror = () => fail(r.error);
  }));
  const firstBad = results.slice(0, 4).find(([, e]) => e);
  document.getElementById('top').textContent = firstBad ? 'Blocked: ' + firstBad[0] : 'WebAssembly works';
  const code = 'KDP1 ' + results.map(([n, e]) => `${n}=${e ? 'blocked' : 'ok'}`).join(' ');
  document.getElementById('code').textContent = code;
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(code).then(() => { document.getElementById('copy').textContent = 'Copied'; }, () => {});
})();
</script>
</body></html>
