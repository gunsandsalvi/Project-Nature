<title>Kindling alpha</title>
<style>
  /* Kindling's web page (A2.6): the game's canvas fills the window, with a one-line status under it. One dark
     look, whatever the viewer's theme. */
  :root {
    color-scheme: dark;
    --ground: #0d0b14;
    --text: #d6cfc0;
    --dim: #8a8394;
    --panel: #1b1824;
    --line: #3a3546;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ground); color: var(--text); }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none; }
  #status {
    position: fixed; left: 16px; right: 16px; bottom: max(12px, env(safe-area-inset-bottom, 0px));
    font: 12px/1.4 system-ui, sans-serif; color: var(--dim); pointer-events: none; overflow-wrap: anywhere;
  }
  #code {
    position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
    max-width: 32rem; margin: 0 auto; padding: 16px; box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    font: 14px/1.45 system-ui, sans-serif;
  }
  #code textarea {
    width: 100%; height: 8rem; box-sizing: border-box; resize: none;
    font: 12px/1.3 ui-monospace, monospace; background: var(--ground); color: var(--text); border: 1px solid var(--line);
  }
  #code button { font: inherit; margin: 8px 8px 0 0; padding: 6px 14px; background: var(--line); color: var(--text); border: 0; border-radius: 4px; }
</style>
<canvas id="cv"></canvas>
<div id="status">Starting…</div>
<div id="code" hidden>
  <strong id="code-title"></strong>
  <p>Something didn't work. Copy the code and paste it into your reply.</p>
  <textarea id="code-text" readonly></textarea>
  <button id="code-copy">Copy</button><button id="code-close">Close</button>
</div>
<script type="module" src="glue.js"></script>
