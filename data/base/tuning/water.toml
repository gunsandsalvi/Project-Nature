# The river's water (A4.5, PRE-26): how it takes the bed's colour as light is lost in it, how wet the bank is, what the
# surface mirrors, the current and the marks on it. Fitted by the art lane to the river's sheet
# (art/catalogue/sheets/4.1-river.webp), over its own bed (art:river_bed), at the sheet's depths, 10 cm warm and clear,
# 40 cm teal, 1 m dark teal, 3 m the bed hardly seen: at 50 cm the water reads lightness 57.9, colourfulness 5.0 and hue
# 185 against the sheet's 57.5, 5.7 and 184. The model is too grey at 10 cm and too light at 3 m (T2.3b.3).
# red goes first and blue last; a third of each colour's light is left at these depths
fade_red = "0.3 m"
fade_green = "0.8 m"
fade_blue = "1.1 m"
# the water's own deep colour comes in as 1 - exp(-(depth / murk) ** curve): clear in the shallows (17% at 10 cm, the
# even rate's 33%) and the same as before by 40 cm, where it has taken four fifths
murk_curve = "150%"
# the water's own deep colour has taken two thirds of the view by this depth
murk = "0.30 m"
deep_colour = "#0d4a55"
# the bed is wet up to 12 cm above the level, keeping 80% of its colour; the shore is ragged by the depth a texture
# pixel spans
wet_margin = "0.12 m"
wet_darkening = "70%"
ragged = "100%"
# above the wet margin the bank is gravel giving way to grass, in clumps, over this much more height (the bank's top is
# 0.40 m over the level); the bank's gravel is the river bed's own until the art lane's bank gravel arrives
beach = "0.28 m"
# the waterline bends: the depth is moved by a noise 6 cm high and 1.4 m wide, so the shore wanders about 20 cm either
# way round the bank instead of running straight; the bed is darkest, 70% of its colour, at the waterline and dry again
# at the top of the wet margin
shore_wander = "6 cm"
shore_scale = "1.4 m"
# the current's marks come and go: the water is rough and calm in stretches about 7 m wide that travel with it, the marks
# keeping 30% of their strength where it is calmest, and they fade in over the first 20 cm of depth, so the shallows
# show their stones and the marks are not one pattern spread evenly over the river
calm_marks = "30%"
calm_scale = "7 m"
marks_depth = "0.2 m"
# the surface mirrors this share of the sky square on, and more as the view grazes it
sky_share = "3%"
# the current runs east at this speed, and the marks and glints step this many times a second
flow = "0.5 m/s"
step_rate = 10
# a glint is one texture pixel lit for three steps; at most this share of them are lit at once
glint_colour = "#f4ead0"
glint_share = "1.2%"
glint_life = 3
# the line where water meets land is one texture pixel wide
shore_colour = "#aac4b6"
shore_width = 1
