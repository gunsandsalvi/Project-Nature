[[decision]]
at_most = 400
then = "a map for each near fire becomes the way, unless your blind test sees a difference from the walk"

[[decision]]
then = "a map for each near fire becomes the way unless your blind test sees a difference, and A18.1's lever applies: shadows from the nearest fires only, until the 0.4 ms line holds"
