way = "walk"
# night: no sun, so no sun shadow pass
shadows = false
interface = false

[[variant]]
name = "fires3-walk-half"
fires = 3
way = "walk-half"
# night: no sun, so no sun shadow pass
shadows = false
interface = false

[[variant]]
name = "fires3-map"
